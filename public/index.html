<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>책 만들기 — bookmaker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <!-- <header>
    <h1>책 만들기</h1>
    <p class="subtitle">글을 출판 가능한 책 PDF로 변환합니다.</p>
  </header> -->

  <form id="form" autocomplete="off">
    <label class="field">
      <span class="label">책 제목 <small>(생략하면 파일명 사용)</small></span>
      <input name="title" type="text" placeholder="예: 어느 봄날의 기록">
    </label>

    <label class="field">
      <span class="label">저자 <small>(선택)</small></span>
      <input name="author" type="text" placeholder="예: 홍길동">
    </label>

    <label class="field">
      <span class="label">책 포맷</span>
      <select name="format" id="format-select" required></select>
    </label>

    <div class="field">
      <span class="label">여백(mm) <small>책 포맷 선택 시 기본값이 채워집니다</small></span>
      <div class="margin-grid">
        <label class="margin-cell">
          <span>위쪽</span>
          <input name="marginTop" id="margin-top" type="number" min="0" step="1" inputmode="decimal">
        </label>
        <label class="margin-cell">
          <span>아래쪽</span>
          <input name="marginBottom" id="margin-bottom" type="number" min="0" step="1" inputmode="decimal">
        </label>
        <label class="margin-cell">
          <span>안쪽 <small>(제본)</small></span>
          <input name="marginInner" id="margin-inner" type="number" min="0" step="1" inputmode="decimal">
        </label>
        <label class="margin-cell">
          <span>바깥쪽</span>
          <input name="marginOuter" id="margin-outer" type="number" min="0" step="1" inputmode="decimal">
        </label>
      </div>
      <label class="checkbox-row">
        <input name="mirror" id="mirror-toggle" type="checkbox" value="on">
        <span>미러 여백 <small>(홀수·짝수 페이지의 안쪽/바깥쪽을 좌우로 번갈아 적용 — 양면 인쇄·제본용)</small></span>
      </label>
    </div>

    <div class="field">
      <!-- <span class="label">본문 조판 <small>(readme 권장 범위)</small></span> -->
      <div class="margin-grid">
        <label class="margin-cell">
          <span>글꼴</span>
          <select name="fontFamily" id="font-family">
            <option value="noto">본명조 (Noto Serif KR)</option>
            <option value="nanum">나눔명조</option>
          </select>
        </label>
        <label class="margin-cell">
          <span>글꼴 크기 <small>(pt)</small></span>
          <input name="fontSizePt" id="font-size" type="number" min="8" max="13" step="0.5" value="10" inputmode="decimal">
        </label>
        <label class="margin-cell">
          <span>행간 <small>(pt)</small></span>
          <input name="lineHeightPt" id="line-height" type="number" min="14" max="24" step="0.5" value="18" inputmode="decimal">
        </label>
        <label class="margin-cell">
          <span>자간 <small>(1/1000)</small></span>
          <input name="letterSpacing" id="letter-spacing" type="number" min="-150" max="0" step="5" value="-50" inputmode="numeric">
        </label>
        <!-- <label class="margin-cell">
          <span>첫 행 들여쓰기 <small>(mm)</small></span>
          <input name="firstIndentMm" id="first-indent" type="number" min="0" max="8" step="0.5" value="3" inputmode="decimal">
        </label> -->
      </div>
    </div>

    <div class="field">
      <span class="label">원고 입력 방식</span>
      <div class="input-mode-toggle" role="tablist">
        <button type="button" class="mode-btn active" data-mode="file" role="tab">파일 업로드</button>
        <button type="button" class="mode-btn" data-mode="text" role="tab">직접 입력</button>
      </div>
    </div>

    <details class="field collapsible" id="file-field" open>
      <summary class="collapsible-summary">원고 파일 <small>(.md / .txt / .docx)</small></summary>
      <div class="collapsible-body">
        <input name="file" type="file" accept=".md,.markdown,.txt,.docx">
      </div>
    </details>

    <details class="field collapsible" id="text-field" open hidden>
      <summary class="collapsible-summary">원고 내용 <small>(Markdown 문법 사용 가능)</small></summary>
      <div class="collapsible-body">
        <textarea name="content" rows="14" placeholder="# 첫 번째 장&#10;&#10;여기에 글을 직접 작성하세요.&#10;&#10;## 절 제목&#10;&#10;본문 내용..."></textarea>
      </div>
    </details>

    <details class="field collapsible" id="toc-field" open>
      <summary class="collapsible-summary">목차 <small>(선택 — 비워두면 본문 헤딩에서 자동 생성)</small></summary>
      <div class="collapsible-body">
        <textarea name="toc" id="toc-input" rows="5" placeholder="한 줄에 한 항목&#10;공백으로 들여쓰면 하위 항목&#10;예:&#10;제1장 봄날의 기록&#10;  들어가며&#10;제2장 여름"></textarea>
        <button type="button" id="toc-autofill-btn" class="btn-secondary toc-autofill">
          본문에서 자동 채우기
        </button>
      </div>
    </details>

    <div class="actions">
      <button id="preview-btn" type="button" class="btn-secondary">미리보기</button>
      <button id="submit" type="submit">PDF 생성</button>
    </div>
  </form>

  <p id="status" class="status"></p>

  <dialog id="preview-modal" class="modal" aria-label="PDF 미리보기">
    <div class="modal-header">
      <span class="modal-title">미리보기</span>
      <div class="modal-actions">
        <button type="button" id="preview-download" class="btn-secondary">다운로드</button>
        <button type="button" class="btn-close" data-close aria-label="닫기">×</button>
      </div>
    </div>
    <iframe id="preview-iframe" class="modal-iframe" title="PDF 미리보기"></iframe>
  </dialog>

  <footer>
    <details>
      <summary>지원하는 입력 형식 자세히</summary>
      <ul>
        <li><strong>Markdown (.md)</strong> — # 제목, **굵게**, *기울임*, &gt; 인용, --- 구분선 등 기본 문법 지원</li>
        <li><strong>일반 텍스트 (.txt)</strong> — 빈 줄로 문단을 구분합니다</li>
        <li><strong>Word (.docx)</strong> — 제목·본문·인용 등 기본 서식 보존 (이미지는 단순화)</li>
      </ul>
    </details>
  </footer>
</main>

<script>
const formatSelect = document.getElementById('format-select');
const form = document.getElementById('form');
const submitBtn = document.getElementById('submit');
const status = document.getElementById('status');
const fileField = document.getElementById('file-field');
const textField = document.getElementById('text-field');
const tocField = document.getElementById('toc-field');
const fileInput = fileField.querySelector('input[type="file"]');
const textInput = textField.querySelector('textarea');
const modeBtns = document.querySelectorAll('.mode-btn');

let mode = 'file';
function setMode(newMode) {
  mode = newMode;
  for (const btn of modeBtns) {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  }
  if (mode === 'file') {
    fileField.hidden = false;
    textField.hidden = true;
    tocField.hidden = true;
    fileField.open = true;
  } else {
    fileField.hidden = true;
    textField.hidden = false;
    tocField.hidden = false;
    textField.open = true;
    tocField.open = true;
  }
}

// A required control inside a collapsed <details> is "not focusable" and
// breaks reportValidity(), so the manuscript source is checked here instead.
function validateSource() {
  if (mode === 'file' && (!fileInput.files || fileInput.files.length === 0)) {
    fileField.hidden = false;
    fileField.open = true;
    status.className = 'status error';
    status.textContent = '원고 파일을 선택해 주세요.';
    return false;
  }
  if (mode === 'text' && !textInput.value.trim()) {
    textField.hidden = false;
    textField.open = true;
    status.className = 'status error';
    status.textContent = '원고 내용을 입력해 주세요.';
    return false;
  }
  return true;
}
for (const btn of modeBtns) {
  btn.addEventListener('click', () => setMode(btn.dataset.mode));
}
setMode('file');

const marginTop = document.getElementById('margin-top');
const marginBottom = document.getElementById('margin-bottom');
const marginInner = document.getElementById('margin-inner');
const marginOuter = document.getElementById('margin-outer');
const formatMap = new Map();

const mmNum = (v) => parseFloat(String(v).replace('mm', ''));

function applyFormatMargins(formatId) {
  const f = formatMap.get(formatId);
  if (!f || !f.margin) return;
  marginTop.value = mmNum(f.margin.top);
  marginBottom.value = mmNum(f.margin.bottom);
  marginInner.value = mmNum(f.margin.left);
  marginOuter.value = mmNum(f.margin.right);
}

function addFormatOption(group, f) {
  const w = f.width.replace('mm', '');
  const h = f.height.replace('mm', '');
  const opt = document.createElement('option');
  opt.value = f.id;
  const use = f.use ? ` · ${f.use}` : '';
  opt.textContent = `${f.name} (${w}×${h}mm)${use}`;
  group.appendChild(opt);
}

fetch('/api/formats')
  .then((r) => r.json())
  .then((formats) => {
    const recommended = document.createElement('optgroup');
    recommended.label = '추천 (표준 판형)';
    const others = document.createElement('optgroup');
    others.label = '기타';
    for (const f of formats) {
      formatMap.set(f.id, f);
      addFormatOption(f.recommended ? recommended : others, f);
    }
    if (recommended.children.length) formatSelect.appendChild(recommended);
    if (others.children.length) formatSelect.appendChild(others);
    if (formatSelect.value) applyFormatMargins(formatSelect.value);
  })
  .catch(() => {
    status.textContent = '서버에서 포맷 목록을 가져오지 못했어요.';
    status.className = 'status error';
  });

formatSelect.addEventListener('change', () => applyFormatMargins(formatSelect.value));

const previewBtn = document.getElementById('preview-btn');
const previewModal = document.getElementById('preview-modal');
const previewIframe = document.getElementById('preview-iframe');
const previewDownload = document.getElementById('preview-download');
const tocInput = document.getElementById('toc-input');
const tocAutofillBtn = document.getElementById('toc-autofill-btn');
let currentPreview = null;

function buildSourceFormData() {
  const fd = new FormData();
  if (mode === 'file' && fileInput.files[0]) {
    fd.append('file', fileInput.files[0]);
  } else if (mode === 'text' && textInput.value.trim()) {
    fd.append('content', textInput.value);
  } else {
    return null;
  }
  return fd;
}

tocAutofillBtn.addEventListener('click', async () => {
  const fd = buildSourceFormData();
  if (!fd) {
    status.className = 'status error';
    status.textContent = '먼저 원고 파일 또는 직접 입력 내용을 채워주세요.';
    return;
  }
  tocAutofillBtn.disabled = true;
  status.className = 'status busy';
  status.textContent = '본문에서 헤딩 추출 중...';
  try {
    const res = await fetch('/api/extract-headings', { method: 'POST', body: fd });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || `오류 ${res.status}`);
    }
    const { headings } = await res.json();
    if (!headings || headings.length === 0) {
      status.className = 'status error';
      status.textContent = '본문에서 헤딩을 찾지 못했어요. (# 또는 ## 사용 필요)';
      return;
    }
    tocInput.value = headings
      .map((h) => (h.level === 2 ? '  ' : '') + h.text)
      .join('\n');
    status.className = 'status ok';
    status.textContent = `${headings.length}개 항목을 채웠어요. 필요하면 자유롭게 수정하세요.`;
  } catch (err) {
    status.className = 'status error';
    status.textContent = '실패: ' + err.message;
  } finally {
    tocAutofillBtn.disabled = false;
  }
});

function setBusy(busy, label) {
  submitBtn.disabled = busy;
  previewBtn.disabled = busy;
  tocAutofillBtn.disabled = busy;
  if (busy) {
    status.className = 'status busy';
    status.textContent = label || 'PDF 생성 중... (긴 글은 30초 이상 걸릴 수 있어요)';
  }
}

async function generatePdf() {
  if (!validateSource()) return null;
  if (!form.reportValidity()) return null;
  const fd = new FormData(form);
  const res = await fetch('/api/convert', { method: 'POST', body: fd });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.error || `오류 ${res.status}`);
  }
  const blob = await res.blob();
  const disp = res.headers.get('content-disposition') || '';
  const m = disp.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/i);
  const filename = m ? decodeURIComponent(m[1]) : 'book.pdf';
  return { blob, filename };
}

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function clearPreview() {
  if (currentPreview) {
    URL.revokeObjectURL(currentPreview.url);
    currentPreview = null;
  }
  previewIframe.src = 'about:blank';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  setBusy(true);
  try {
    const result = await generatePdf();
    if (!result) return;
    triggerDownload(result.blob, result.filename);
    status.className = 'status ok';
    status.textContent = `완료 — ${result.filename} 다운로드됨`;
  } catch (err) {
    status.className = 'status error';
    status.textContent = '실패: ' + err.message;
  } finally {
    setBusy(false);
  }
});

previewBtn.addEventListener('click', async () => {
  if (!validateSource()) return;
  if (!form.reportValidity()) return;
  setBusy(true, '미리보기 생성 중...');
  try {
    const result = await generatePdf();
    if (!result) return;
    clearPreview();
    const url = URL.createObjectURL(result.blob);
    currentPreview = { url, blob: result.blob, filename: result.filename };
    previewIframe.src = url;
    if (typeof previewModal.showModal === 'function') {
      previewModal.showModal();
    } else {
      previewModal.setAttribute('open', '');
    }
    status.className = 'status ok';
    status.textContent = '미리보기 준비 완료';
  } catch (err) {
    status.className = 'status error';
    status.textContent = '실패: ' + err.message;
  } finally {
    setBusy(false);
  }
});

previewDownload.addEventListener('click', () => {
  if (currentPreview) triggerDownload(currentPreview.blob, currentPreview.filename);
});

previewModal.addEventListener('close', clearPreview);

previewModal.addEventListener('click', (e) => {
  const target = e.target;
  if (target.matches('[data-close]')) {
    previewModal.close();
    return;
  }
  if (target === previewModal) {
    const rect = previewModal.getBoundingClientRect();
    const inside =
      e.clientX >= rect.left &&
      e.clientX <= rect.right &&
      e.clientY >= rect.top &&
      e.clientY <= rect.bottom;
    if (!inside) previewModal.close();
  }
});
</script>
</body>
</html>
